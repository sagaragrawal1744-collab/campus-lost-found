
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Registration | Campus Lost & Found</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 32px 16px;
            background: #f6f5ef; color: #242820;
            font-family: Arial, sans-serif;
        }
        main {
            max-width: 440px; margin: 25px auto; padding: 30px;
            background: white; border: 1px solid #e4e3da;
            border-radius: 12px;
        }
        h1 { margin-top: 0; font-size: 26px; }
        p { line-height: 1.5; color: #62675e; }
        label { display: block; margin: 17px 0 7px; font-size: 14px; font-weight: bold; }
        input {
            width: 100%; padding: 12px; border: 1px solid #d5d7ce;
            border-radius: 7px; font-size: 15px;
        }
        button {
            width: 100%; margin-top: 22px; padding: 13px;
            border: 0; border-radius: 7px;
            background: #315b42; color: white; cursor: pointer;
        }
        a { color: #315b42; }
        .message { padding: 10px; margin: 10px 0; background: #f3f4ee; border-radius: 6px; }
    </style>
</head>
<body>
<main>
    <h1>Create your account</h1>
    <p>Use your college email or roll number to register.</p>

    {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="message">{{ message }}</div>
    {% endfor %}

    <form method="POST" action="{{ url_for('register') }}">
        <label for="full_name">Full name</label>
        <input id="full_name" name="full_name" maxlength="100"
               autocomplete="name" required>

        <label for="college_email">College email (optional)</label>
        <input id="college_email" name="college_email" type="email"
               maxlength="254" autocomplete="email">

        <label for="roll_number">College roll number (optional)</label>
        <input id="roll_number" name="roll_number" maxlength="50">

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               minlength="8" maxlength="128"
               autocomplete="new-password" required>

        <label for="confirm_password">Confirm password</label>
        <input id="confirm_password" name="confirm_password"
               type="password" minlength="8" maxlength="128"
               autocomplete="new-password" required>

        <button type="submit">Create account</button>
    </form>

    <p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
    <p><a href="{{ url_for('home') }}">Back to homepage</a></p>
</main>
</body>
</html>
