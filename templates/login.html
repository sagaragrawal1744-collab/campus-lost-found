
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Campus Lost & Found</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 32px 16px;
            background: #f6f5ef; color: #242820;
            font-family: Arial, sans-serif;
        }
        main {
            max-width: 420px; margin: 35px auto; padding: 30px;
            background: white; border: 1px solid #e4e3da;
            border-radius: 12px;
        }
        h1 { margin-top: 0; font-size: 26px; }
        p { line-height: 1.5; color: #62675e; }
        label { display: block; margin: 18px 0 7px; font-size: 14px; font-weight: bold; }
        input {
            width: 100%; padding: 12px; border: 1px solid #d5d7ce;
            border-radius: 7px; font-size: 15px;
        }
        button {
            width: 100%; margin-top: 22px; padding: 13px;
            border: 0; border-radius: 7px;
            background: #315b42; color: white; cursor: pointer;
        }
        a { color: #315b42; }
        .message { padding: 10px; margin: 10px 0; background: #f3f4ee; border-radius: 6px; }
    </style>
</head>
<body>
<main>
    <h1>Welcome back</h1>
    <p>Log in with your college email or roll number.</p>

    {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="message">{{ message }}</div>
    {% endfor %}

    <form method="POST" action="{{ url_for('login') }}">
        <label for="identifier">College email or roll number</label>
        <input id="identifier" name="identifier"
               autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>

        <button type="submit">Log in</button>
    </form>

    <p>New here? <a href="{{ url_for('register') }}">Create an account</a></p>
    <p><a href="{{ url_for('home') }}">Back to homepage</a></p>
</main>
</body>
</html>
